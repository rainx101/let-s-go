# Dependabot: opens PRs when dependencies (or CI actions) have updates,
# including security fixes. Free, set-and-forget.
version: 2
updates:
  # Python deps (uv reads pyproject.toml + uv.lock natively).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The GitHub Actions used in our CI workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
