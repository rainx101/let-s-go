# Local gatekeeper: these run on `git commit` (managed by prek).
# Same checks as CI, so problems are caught before they leave your laptop.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check    # lint (auto-fixes what it safely can)
        args: [--fix]
      - id: ruff-format   # format

  - repo: local
    hooks:
      - id: ty
        name: ty (type check)
        entry: uv run ty check
        language: system
        pass_filenames: false
        types: [python]

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        types: [python]
